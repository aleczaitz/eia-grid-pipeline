<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EIA Pipeline Architecture</title>
<style>
  :root {
    --fg: var(--foreground, #1f1f1d);
    --mut: var(--muted-foreground, #6b6965);
    --box: var(--card, #ffffff);
    --ext: var(--secondary, #f1f0ed);
    --line: var(--border, #d4d2cc);
    --seed: var(--warning, #c2410c);
    --live: var(--info, #2563eb);
    --mono: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
  }
  svg { width: 100%; height: auto; display: block; font-family: var(--font-sans, system-ui, sans-serif); }
  .box  { fill: var(--box); stroke: var(--line); stroke-width: 1; }
  .ext  { fill: var(--ext); stroke: var(--line); stroke-width: 1; }
  .dbx  { fill: color-mix(in srgb, var(--live) 6%, transparent); stroke: color-mix(in srgb, var(--live) 40%, transparent); stroke-width: 1.2; stroke-dasharray: 2 3; }
  .t    { fill: var(--fg); font-size: 12.5px; font-weight: 600; }
  .s    { fill: var(--mut); font-size: 11px; }
  .m    { font-family: var(--mono); font-size: 10.5px; }
  .lane { fill: var(--mut); font-size: 10px; font-weight: 600; letter-spacing: .08em; }
  .lbl  { font-size: 10.5px; font-weight: 600; }
  .seed { stroke: var(--seed); stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
  .live { stroke: var(--live); stroke-width: 1.6; fill: none; }
  .seedf { fill: var(--seed); }
  .livef { fill: var(--live); }
  p { color: var(--mut); font-size: 12px; line-height: 1.5; margin: 10px 4px 0; }
  code { font-family: var(--mono); font-size: 11px; }
</style>
</head>
<body>
<svg viewBox="0 0 740 496" role="img" aria-label="EIA pipeline architecture: one-time seed from the EIA bulk file and hourly trickle from the EIA API, both landing in Delta tables in Databricks, served by a SQL warehouse to an AI/BI dashboard.">
  <defs>
    <marker id="aSeed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="seedf"/></marker>
    <marker id="aLive" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="livef"/></marker>
  </defs>

  <!-- Databricks boundary (everything except the bulk file, the laptop and the EIA API) -->
  <path class="dbx" d="M528,18 H732 V488 H8 V252 H286 V108 H528 Z"/>
  <text class="lane" x="722" y="480" text-anchor="end" style="fill: var(--live)">DATABRICKS FREE EDITION</text>

  <text class="lane" x="20" y="14">ONCE · SEED</text>
  <text class="lane" x="300" y="14">EVERY HOUR · TRICKLE</text>

  <!-- Row 1: sources + secret -->
  <rect class="ext" x="20" y="26" width="230" height="60" rx="8"/>
  <text class="t" x="135" y="51" text-anchor="middle">EIA bulk file</text>
  <text class="s" x="135" y="70" text-anchor="middle">EBA.zip · 703 MB · 2019 → now</text>

  <rect class="ext" x="300" y="26" width="200" height="60" rx="8"/>
  <text class="t" x="400" y="51" text-anchor="middle">EIA API v2</text>
  <text class="s" x="400" y="70" text-anchor="middle">region-data · fuel-type-data</text>

  <rect class="box" x="540" y="26" width="180" height="60" rx="8"/>
  <text class="t" x="630" y="51" text-anchor="middle">Secret scope</text>
  <text class="s m" x="630" y="70" text-anchor="middle">eia / api_key</text>

  <!-- Row 1 -> Row 2 -->
  <line class="seed" x1="135" y1="86" x2="135" y2="121" marker-end="url(#aSeed)"/>
  <line class="live" x1="400" y1="86" x2="400" y2="121" marker-end="url(#aLive)"/>
  <line class="live" x1="630" y1="86" x2="630" y2="121" marker-end="url(#aLive)"/>
  <text class="s" x="638" y="108">X-Api-Key header</text>

  <!-- Row 2: laptop + hourly job -->
  <rect class="ext" x="20" y="124" width="230" height="80" rx="8"/>
  <text class="t" x="135" y="148" text-anchor="middle">Laptop · DuckDB</text>
  <text class="s m" x="135" y="167" text-anchor="middle">convert_bulk.py</text>
  <text class="s" x="135" y="186" text-anchor="middle">4.4 GB JSON → 180 MB Parquet</text>

  <rect class="box" x="300" y="124" width="420" height="118" rx="8" style="stroke: var(--live)"/>
  <text x="314" y="147"><tspan class="t">Hourly job</tspan><tspan class="s m" dx="8">cron 0 10 * * * ?  (UTC)</tspan></text>
  <text class="s" x="314" y="171">1  window: last OK run − 36h</text>
  <text class="s" x="314" y="191">2  fetch, 5k rows per page</text>
  <text class="s" x="314" y="211">3  land raw JSON</text>
  <text class="s" x="534" y="171">4  MERGE on natural key</text>
  <text class="s" x="534" y="191">5  log the run</text>
  <text class="s" x="314" y="232" style="font-style: italic">1 run at a time · retries with backoff · email on failure</text>

  <!-- Row 2 -> Row 3 -->
  <line class="seed" x1="110" y1="204" x2="110" y2="277" marker-end="url(#aSeed)"/>
  <text class="lbl" x="118" y="234" style="fill: var(--seed)">upload once</text>
  <path class="live" d="M330,242 V262 H200 V277" marker-end="url(#aLive)"/>
  <line class="live" x1="395" y1="242" x2="395" y2="277" marker-end="url(#aLive)"/>
  <text class="lbl" x="403" y="265" style="fill: var(--live)">MERGE</text>
  <line class="live" x1="630" y1="242" x2="630" y2="277" marker-end="url(#aLive)"/>
  <text class="lbl" x="638" y="265" style="fill: var(--live)">log run</text>

  <!-- Row 3: storage (Unity Catalog workspace.eia) -->
  <rect class="box" x="20" y="280" width="230" height="90" rx="8"/>
  <text class="t" x="135" y="304" text-anchor="middle">Volume <tspan class="m">raw/</tspan></text>
  <text class="s" x="135" y="327" text-anchor="middle"><tspan class="m">seed/</tspan>  3 Parquet files (once)</text>
  <text class="s" x="135" y="347" text-anchor="middle"><tspan class="m">api/</tspan>  raw JSON from every run</text>

  <line class="seed" x1="250" y1="325" x2="277" y2="325" marker-end="url(#aSeed)"/>
  <text class="lbl" x="264" y="317" text-anchor="middle" style="fill: var(--seed); font-size: 9.5px">CTAS</text>

  <rect class="box" x="280" y="280" width="230" height="90" rx="8"/>
  <text class="t" x="395" y="304" text-anchor="middle">Delta tables</text>
  <text class="s m" x="395" y="327" text-anchor="middle">region_data · fuel_type_data</text>
  <text class="s m" x="395" y="345" text-anchor="middle">respondents</text>
  <text class="s" x="395" y="362" text-anchor="middle">~46M rows</text>

  <rect class="box" x="540" y="280" width="180" height="90" rx="8"/>
  <text class="t m" x="630" y="304" text-anchor="middle" style="font-size: 12px">ingest_runs</text>
  <text class="s" x="630" y="327" text-anchor="middle">one row per run</text>
  <text class="s" x="630" y="345" text-anchor="middle">(the continuity ledger)</text>

  <!-- Row 3 -> Row 4 -->
  <line class="live" x1="395" y1="370" x2="395" y2="405" marker-end="url(#aLive)"/>
  <path class="live" d="M600,370 V389 H480 V405" marker-end="url(#aLive)"/>

  <!-- Row 4: serving -->
  <rect class="box" x="280" y="408" width="230" height="58" rx="8"/>
  <text class="t" x="395" y="432" text-anchor="middle">SQL Warehouse</text>
  <text class="s" x="395" y="451" text-anchor="middle">2X-Small · serverless</text>

  <line class="live" x1="510" y1="437" x2="537" y2="437" marker-end="url(#aLive)"/>

  <rect class="box" x="540" y="408" width="180" height="58" rx="8"/>
  <text class="t" x="630" y="432" text-anchor="middle">AI/BI dashboard</text>
  <text class="s" x="630" y="451" text-anchor="middle">published · cached ≤ 24h</text>

  <!-- Legend -->
  <line class="seed" x1="24" y1="418" x2="56" y2="418"/>
  <text class="s" x="64" y="422">once (seed)</text>
  <line class="live" x1="24" y1="438" x2="56" y2="438"/>
  <text class="s" x="64" y="442">every hour (trickle)</text>
  <rect class="dbx" x="24" y="451" width="32" height="14" rx="3"/>
  <text class="s" x="64" y="462">inside Databricks</text>
</svg>
<p>Everything in Databricks lives in Unity Catalog schema <code>workspace.eia</code>. A Delta table is Parquet files plus a <code>_delta_log</code> transaction log, stored on S3. The MERGE upserts on <code>(period, respondent, type | fueltype)</code>, so re-fetching the 36-hour overlap every run changes nothing that hasn't changed.</p>
</body>
</html>
